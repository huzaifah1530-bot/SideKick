# OBSOLETE standalone XcodeGen scaffold; this does not build the shipped product.
# Its source tree omits SideStore/SideSign/Minimuxer dependencies and its 1.0.0
# version is not authoritative. Use .github/workflows/ios-build.yml: CI applies
# the SideStore integration patches and edits, then builds the SideStore
# scheme from Vendor/SideStore/AltStore.xcodeproj. The integration script stamps
# marketing version 0.10.0; CI sets CURRENT_PROJECT_VERSION from the run number.
# Product startup belongs to the patched SideStore SceneDelegate/AppDelegate.
name: SideKick
options:
  deploymentTarget:
    iOS: "18.0"
  bundleIdPrefix: com.sidekick
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
targets:
  SideKick:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SideKick
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidekick.app
        INFOPLIST_KEY_CFBundleDisplayName: SideKick
        PRODUCT_NAME: SideKick
        INFOPLIST_FILE: $(SRCROOT)/SideKick/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
    dependencies:
      - package: ZIPFoundation
