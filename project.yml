name: SideKick
options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: com.sidekick
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  SideKick:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SideKick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidekick.app
        INFOPLIST_KEY_CFBundleDisplayName: SideKick
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
