name: SideKick
options:
  deploymentTarget:
    iOS: "18.0"
  bundleIdPrefix: com.sidekick
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
targets:
  SideKick:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SideKick
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidekick.app
        INFOPLIST_KEY_CFBundleDisplayName: SideKick
        PRODUCT_NAME: SideKick
        INFOPLIST_FILE: $(SRCROOT)/SideKick/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
    dependencies:
      - package: ZIPFoundation
