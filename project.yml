name: SideKick
options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: com.sidekick
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  SideKick:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SideKick
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidekick.app
        INFOPLIST_KEY_CFBundleDisplayName: SideKick
        PRODUCT_NAME: SideKick
        INFOPLIST_FILE: SideKick/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
