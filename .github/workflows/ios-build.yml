name: SideKick iOS Build

on:
  push:
    branches: [main]
    paths:
      - "SideKick/**"
      - "Vendor/SideStore"
      - ".gitmodules"
      - "patches/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build-ipa:
    name: Build unsigned SideKick IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found on this runner. Available Xcodes:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Apply SideKick integration patch to SideStore
        run: git -C Vendor/SideStore apply ../../patches/sidestore-sidekick.patch

      - name: Apply Swift compiler workaround
        run: git -C Vendor/SideStore apply ../../patches/sidestore-compiler-workarounds.patch

      - name: Isolate upstream SwiftUI settings expression
        run: git -C Vendor/SideStore apply ../../patches/sidestore-view-body-compile.patch

      - name: Build integrated SideKick app for iOS
        run: |
          xcodebuild -project Vendor/SideStore/AltStore.xcodeproj \
            -scheme SideStore \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/SideStore.app"
          test -d "$APP_PATH"

          # SideKick is a standalone app and does not ship SideStore's widget.
          # The upstream scheme embeds AltWidgetExtension.appex, but the
          # unsigned CI build cannot carry a valid provisioning profile for it.
          # Leaving it in the IPA makes iOS reject the whole install with
          # "The app extension is missing a valid provisioning profile".
          if [ -d "$APP_PATH/PlugIns" ]; then
            find "$APP_PATH/PlugIns" -maxdepth 1 -type d -name '*.appex' -print -exec rm -rf {} +
            rmdir "$APP_PATH/PlugIns" 2>/dev/null || true
          fi
          if [ -d "$APP_PATH/PlugIns" ]; then
            echo "Unexpected app extensions remain in the SideKick bundle"
            exit 1
          fi

          mkdir -p Payload artifacts
          cp -R "$APP_PATH" Payload/
          zip -r -X artifacts/SideKick-unsigned.ipa Payload

      - name: Create corresponding source archive
        run: |
          set -euo pipefail
          tar -czf artifacts/SideKick-corresponding-source.tar.gz \
            --exclude='./.git' \
            --exclude='*/.git' \
            --exclude='./build' \
            --exclude='./artifacts' \
            --exclude='./Payload' \
            --exclude='./sidestore-reference' \
            --exclude='./failed-run' \
            --exclude='./action-logs-*' \
            .

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideKick-unsigned-ipa
          path: artifacts/SideKick-unsigned.ipa
          if-no-files-found: error

      - name: Upload corresponding source artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideKick-corresponding-source
          path: artifacts/SideKick-corresponding-source.tar.gz
          if-no-files-found: error
