name: SideKick iOS Build

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "SideKick/**"
      - "Tests/**"
      - "Package.swift"
      - "SideKickVPN/**"
      - "scripts/**"
      - "Vendor/SideStore"
      - ".gitmodules"
      - "patches/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned SideKick IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found on this runner. Available Xcodes:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Test SideKick scanner, persistence, baseline, and storage boundaries
        run: swift test

      - name: Apply SideKick integration patch to SideStore
        run: git -C Vendor/SideStore apply ../../patches/sidestore-sidekick.patch

      - name: Classify the certificate being checked for install errors
        run: git -C Vendor/SideStore apply --unidiff-zero ../../patches/sidestore-certificate-error-classification.patch

      - name: Use the selected account certificate instead of stale per-app certificate records
        run: git -C Vendor/SideStore apply --unidiff-zero ../../patches/sidestore-use-account-certificate-for-refresh.patch

      - name: Apply Swift compiler workaround
        run: git -C Vendor/SideStore apply ../../patches/sidestore-compiler-workarounds.patch

      - name: Isolate upstream SwiftUI settings expression
        run: git -C Vendor/SideStore apply ../../patches/sidestore-view-body-compile.patch

      - name: Embed SideKick local VPN extension
        run: python3 scripts/embed-local-vpn.py Vendor/SideStore

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ hashFiles('Vendor/SideStore/**/Package.resolved') }}

      - name: Build integrated SideKick app for iOS
        run: |
          set -euo pipefail
          # Each CI run stamps a higher build number so SideKick can test update detection.
          xcodebuild -project Vendor/SideStore/AltStore.xcodeproj \
            -scheme SideStore \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            clean build 2>&1 | tee "$RUNNER_TEMP/sidekick-build.log"

      - name: Report compiler errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sidekick-build.log"
          if log.exists():
              for line in log.read_text(errors="replace").splitlines():
                  if "error:" not in line:
                      continue
                  # Surface compiler diagnostics in the job's public annotations.
                  message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error::{message}")
          PY

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SideKick-build-log
          path: ${{ runner.temp }}/sidekick-build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/SideStore.app"
          test -d "$APP_PATH"

          # Preserve the local VPN provider; remove only the unsupported widget.
          if [ -d "$APP_PATH/PlugIns/AltWidgetExtension.appex" ]; then
            rm -rf "$APP_PATH/PlugIns/AltWidgetExtension.appex"
          fi
          VPN_PATH="$APP_PATH/PlugIns/SideKickVPN.appex"
          test -d "$VPN_PATH"
          test -f "$VPN_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$VPN_PATH/Info.plist")" = "com.apple.networkextension.packet-tunnel"
          if find "$APP_PATH/PlugIns" -maxdepth 1 -type d -name '*.appex' ! -name 'SideKickVPN.appex' | grep -q .; then
            echo "Unexpected app extensions remain in the SideKick bundle"
            exit 1
          fi
          mkdir -p "$APP_PATH/ThirdPartyLicenses"
          cp SideKickVPN/LICENSE "$APP_PATH/ThirdPartyLicenses/LocalDevVPN.txt"
          # Ad-hoc signatures preserve entitlement requests for IPA re-signers.
          # They are not provisioning profiles and do not make this IPA installable.
          if [ -d "$APP_PATH/Frameworks" ]; then
            while IFS= read -r -d '' framework; do
              codesign --force --sign - "$framework"
            done < <(find "$APP_PATH/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0)
          fi
          codesign --force --sign - --entitlements SideKickVPN/SideKickVPN.entitlements "$VPN_PATH"
          codesign --force --sign - --entitlements SideKickVPN/Host.entitlements "$APP_PATH"

          # Optional build for profiles that support Network Extensions.
          mkdir -p VPNPayload/Payload artifacts
          cp -R "$APP_PATH" VPNPayload/Payload/
          (cd VPNPayload && zip -r -X ../artifacts/SideKick-vpn-unsigned.ipa Payload)

          # The default IPA works with free Apple IDs and external LocalDevVPN.
          # Drop the extension AND the host's VPN entitlement requests.
          rm -rf "$VPN_PATH"
          python3 - <<'PY'
          import os, pathlib, plistlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sidekick-external.entitlements"
          path.write_bytes(plistlib.dumps({}))
          PY
          codesign --force --sign - --entitlements "$RUNNER_TEMP/sidekick-external.entitlements" "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X artifacts/SideKick-unsigned.ipa Payload

      - name: Create corresponding source archive
        run: |
          set -euo pipefail
          tar -czf artifacts/SideKick-corresponding-source.tar.gz \
            --exclude='./.git' \
            --exclude='*/.git' \
            --exclude='./.build' \
            --exclude='./.swiftpm' \
            --exclude='./build' \
            --exclude='./artifacts' \
            --exclude='./Payload' \
            --exclude='./VPNPayload' \
            --exclude='./sidestore-reference' \
            --exclude='./failed-run' \
            --exclude='./action-logs-*' \
            .

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideKick-unsigned-ipa
          path: artifacts/SideKick-unsigned.ipa
          if-no-files-found: error

      - name: Upload optional built-in VPN IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideKick-vpn-unsigned-ipa
          path: artifacts/SideKick-vpn-unsigned.ipa
          if-no-files-found: error

      - name: Upload corresponding source artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideKick-corresponding-source
          path: artifacts/SideKick-corresponding-source.tar.gz
          if-no-files-found: error
